# PlaViSCA app: which data columns the app uses.
# =============================================================================
# Maps the field names used in ui.R, server.R and functions/ to the columns of
# the cell metadata (cleaned_dataset.rds$mr_data) written by the preprocessing
# pipeline (stage 50; the columns are described in
# PlaViSCA-meta-analysis/metadata/columns.tsv). The expression matrices
# (normalized_expression.rds, raw_expression.rds) carry no metadata: their
# rows are the cells of mr_data, in the same order.
#
# Every metadata column used as a filter, "Color by", "Group by" or detail
# field is declared here and read through get_data_column() /
# get_data_label(); column names are not written anywhere else in the app.
# =============================================================================

# Display string used wherever a true R NA must be shown to a user. A field
# can set its own with `missing_label:` (e.g. gametocyte_state below).
missing_label: "Missing"

expected_studies:
  - Hazzard2022
  - Hazzard2024
  - Mancio-Silva2022
  - Ruberto2022_1
  - Ruberto2022_2
  - Sa2020

# Column names the app does not use. Their information is in the fields below
# (development_phase, parasite_stage(s), life_cycle_stage, blood_stage:
# broad_stage and detailed_stage; hour_post_invasion: idc_reference_class;
# geographic_location: parasite_origin_location). Data files may contain them,
# but no field may map to them (checked at startup and by the tests).
unsupported_columns:
  - development_phase
  - parasite_stages
  - parasite_stage
  - life_cycle_stage
  - hour_post_invasion
  - geographic_location
  - blood_stage

fields:
  # ---------------------------------------------------------------- identity
  barcode:
    label: "Cell ID"
    column: barcode
    role: identity
    required: true
  study_label:
    label: "Study label"
    column: study_label
    role: filter
    required: true
  study_pmid:
    label: "PubMed ID"
    column: study_pmid
    role: detail
    required: true
  run_id:
    label: "SRA run"
    column: run_id
    role: detail
    required: true
  author_cell_id:
    label: "Cell ID (authors)"
    column: author_cell_id
    role: detail
    required: true
    help: >
      Identifier of the cell in the source study's data; missing for
      Hazzard2022, whose cells were called by PlaViSCA.
  n_count_rna:
    label: "RNA count"
    column: n_count_rna
    role: qc
    required: true
  n_feature_rna:
    label: "Feature count"
    column: n_feature_rna
    role: qc
    required: true

  # ----------------------------------------------------------- life cycle
  broad_stage:
    label: "Broad life-cycle stage"
    column: broad_stage
    role: filter
    required: true
    help: >
      Blood, liver or sporozoite stage. Each life-cycle stage belongs to
      exactly one broad stage.
  detailed_stage:
    label: "Life-cycle stage"
    column: stage
    role: filter
    required: true
    help: >
      For host-blood cells, the gametocyte call of the cell's cluster,
      otherwise the stage of the most similar reference time point; for the
      other cells (sporozoites, liver stages), the stage given by the
      authors. "Source of the life-cycle stage" says which one was used.
  source_life_cycle_stage:
    label: "Life-cycle stage (authors)"
    column: author_stage
    role: detail
    required: true
    help: >
      Stage assigned by the authors of the study (Sa2020 gametocytes, liver
      forms, sporozoite samples).
  source_stage_provenance:
    label: "Source of the life-cycle stage"
    column: stage_source
    role: detail
    required: true
    help: >
      author (stage given by the authors), gametocyte_markers (gametocyte
      call of the cluster) or idc_reference (most similar reference time
      point).

  # ------------------------------------------------- IDC reference-time class
  idc_reference_class:
    label: "Most similar reference time point (h)"
    column: idc_timepoint
    role: filter
    required: true
    numeric_sort: true
    help: >
      Time point of the reference blood-stage time course (Zhu et al. 2016)
      whose expression is most similar to the cell (SingleR). It is a
      similarity, not a measured age. Only blood cells with at least 20 UMIs
      have a value.
  idc_heuristic_stage_bin:
    label: "Stage of the reference time point"
    column: idc_stage
    role: detail
    required: true
    help: >
      Stage assigned to the reference time point: 6-12 h ring/early
      trophozoite, 24 h
      trophozoite, 32-42 h schizont, 48 h late schizont/merozoite. This
      assignment is defined by PlaViSCA, not by the reference publication.
  idc_similarity_score_delta:
    label: "Reference similarity delta"
    column: idc_delta
    role: detail
    required: true
    help: "SingleR delta.next: margin between the best and next-best class."

  # ------------------------------------------------- gametocyte provenance
  pred_gametocyte_sex:
    label: "Gametocyte call of the cluster"
    column: cluster_gametocyte_call
    role: detail
    required: true
    help: >
      Female or male gametocytes if the cell's cluster has high marker
      scores for that sex (computed by PlaViSCA, blood cells with at least
      10 UMIs only).
  gametocyte_state:
    label: "Gametocyte state"
    column: gametocyte_state
    role: filter
    required: true
    missing_label: "No gametocyte"
    help: >
      State along the sexual branch, from the clusters of the blood-stage
      cells: developing gametocyte (sex not yet called), early or late
      female, early or late male.
  source_sex_annotation:
    label: "Gametocyte sex (authors)"
    column: author_sex
    role: detail
    required: true
    help: >
      Gametocyte sex given by the authors (Sa2020).
  source_pseudogroup:
    label: "Sexual/asexual group (authors)"
    column: author_pseudogroup
    role: detail
    required: true
    help: "Hazzard2024: the authors' group of the cell (Sexual, GroupA, ...)."

  # ---------------------------------------------------------------- sample
  host_species:
    label: "Host species"
    column: host_species
    role: filter
    required: true
  tissue_or_sample_type:
    label: "Host and tissue"
    column: tissue
    role: filter
    required: true
    help: >
      Host blood, Host liver or Vector salivary gland. Only blood cells are
      used to infer blood stages and gametocytes.
  treatment:
    label: "Treatment"
    column: treatment
    role: filter
    required: true
    help: >
      "Study control" is the control arm of a drug experiment; "No treatment"
      means the study had no drug arm. Drug names are shown as given by the
      authors.
  parasite_lineage_isolate:
    label: "Parasite strain / isolate"
    column: strain
    role: filter
    required: true
  day_post_infection:
    label: "Day post infection"
    column: day_post_infection
    role: filter
    required: true
    numeric_sort: true

  # -------------------------------------------------------------- geography
  parasite_origin_location:
    label: "Parasite origin location"
    column: parasite_origin_location
    role: filter
    required: true
    help: >
      Geographic origin of the parasite strain or isolate, from the
      publication.

  # -------------------------------------------------------------- technical
  sc_technology:
    label: "Single-cell technology"
    column: sc_technology
    role: filter
    required: true
  sequencer:
    label: "Sequencer"
    column: sequencer
    role: filter
    required: true
    help: >
      Sequencing instrument registered for the run in ENA/SRA.

  # ------------------------------------------------ biological replicate
  biological_replicate_id:
    label: "Biological replicate"
    column: replicate_id
    role: filter
    required: true
    help: >
      Independent biological replicate (an animal or an infection, see
      "Replicate type").
  biological_replicate_type:
    label: "Replicate type"
    column: replicate_type
    role: detail
    required: true

  # ------------------------------------------------- count provenance (QC)
  source_of_counts:
    label: "Count source"
    column: count_source
    role: detail
    required: true

# Logical keys shown in the shared filter row on every analysis tab, in order.
filter_fields:
  - study_label
  - broad_stage
  - detailed_stage
  - gametocyte_state
  - host_species
  - tissue_or_sample_type
  - treatment
  - parasite_lineage_isolate
  - idc_reference_class

# Logical keys offered as "Color by" / "Group by" categories.
category_fields:
  - study_label
  - broad_stage
  - detailed_stage
  - gametocyte_state
  - host_species
  - tissue_or_sample_type
  - treatment
  - parasite_lineage_isolate
  - parasite_origin_location
  - sc_technology

# Logical keys offered in the Metadata plots tab, in the order of its menus.
plot_fields:
  - study_label
  - broad_stage
  - detailed_stage
  - source_life_cycle_stage
  - source_stage_provenance
  - idc_reference_class
  - gametocyte_state
  - pred_gametocyte_sex
  - source_sex_annotation
  - host_species
  - tissue_or_sample_type
  - parasite_lineage_isolate
  - parasite_origin_location
  - day_post_infection
  - treatment
  - sc_technology
  - sequencer

# Logical keys surfaced in the metadata detail table, in order.
detail_table_fields:
  - barcode
  - study_label
  - run_id
  - author_cell_id
  - tissue_or_sample_type
  - host_species
  - parasite_lineage_isolate
  - parasite_origin_location
  - treatment
  - broad_stage
  - detailed_stage
  - source_life_cycle_stage
  - source_stage_provenance
  - idc_reference_class
  - idc_heuristic_stage_bin
  - gametocyte_state
  - pred_gametocyte_sex
  - source_sex_annotation
  - source_pseudogroup
  - biological_replicate_id
  - biological_replicate_type
  - day_post_infection
  - sc_technology
  - sequencer
  - source_of_counts
  - n_count_rna
  - n_feature_rna

# Biological (not alphabetical) ordering for categorical vocabularies.
# Levels that do not occur in the loaded data are simply dropped at render
# time - never invented to fill the ordering.
vocabularies:
  broad_stage:
    - Sporozoite stage
    - Liver stage
    - Blood stage
    - Mosquito stage
  detailed_stage:
    - Sporozoite
    - Hypnozoite
    - Schizont (Liver stage)
    - Ring/Early trophozoite
    - Trophozoite
    - Schizont (Blood stage)
    - Merozoite
    - Developing gametocyte
    - Male gametocyte
    - Female gametocyte
  pred_gametocyte_sex:
    - Male gametocyte
    - Female gametocyte
    - Not_applicable
  source_sex_annotation:
    - Male gametocyte
    - Female gametocyte
  gametocyte_state:
    - Developing gametocyte
    - Early female
    - Late female
    - Early male
    - Late male
  idc_heuristic_stage_bin:
    - Ring/Early trophozoite
    - Trophozoite
    - Schizont (Blood stage)
    - Merozoite

# Detailed -> broad life-cycle stage mapping, the app's copy of
# PlaViSCA-meta-analysis/metadata/stages.tsv. The broad/detailed stage filters use
# it to offer only compatible choices. It is checked against the loaded data
# at startup; if the data disagree, the app stops.
stage_compatibility:
  Sporozoite: Sporozoite stage
  Hypnozoite: Liver stage
  Schizont (Liver stage): Liver stage
  Ring/Early trophozoite: Blood stage
  Trophozoite: Blood stage
  Schizont (Blood stage): Blood stage
  Merozoite: Blood stage
  Developing gametocyte: Blood stage
  Male gametocyte: Blood stage
  Female gametocyte: Blood stage

# Fixed colours for some values (the others use the automatic palette).
# Each study and each life-cycle stage has one colour in every field that
# shows it, the same as in the manuscript figures (PlaViSCA-meta-analysis,
# R/lib/plots.R): the asexual blood cycle from yellow to dark red,
# gametocytes in pale blue, green and blue (early lighter than late), liver
# stages in lilac and purple, sporozoites in dark teal. Every pair of stage
# colours stays distinguishable with protanopia and deuteranopia. Studies
# use the Okabe-Ito colours.
colors:
  study_label:
    Sa2020: "#0072B2"
    Hazzard2022: "#E69F00"
    Hazzard2024: "#56B4E9"
    Ruberto2022_1: "#CC79A7"
    Mancio-Silva2022: "#009E73"
    Ruberto2022_2: "#D55E00"
  broad_stage:
    Blood stage: "#BB4400"
    Liver stage: "#773388"
    Sporozoite stage: "#114444"
  detailed_stage:
    Sporozoite: "#114444"
    Hypnozoite: "#CC88DD"
    Schizont (Liver stage): "#773388"
    Ring/Early trophozoite: "#DDDD55"
    Trophozoite: "#EE8844"
    Schizont (Blood stage): "#BB4400"
    Merozoite: "#771100"
    Developing gametocyte: "#AACCDD"
    Female gametocyte: "#118866"
    Male gametocyte: "#3377CC"
  gametocyte_state:
    Developing gametocyte: "#AACCDD"
    Early female: "#00BB99"
    Late female: "#226655"
    Early male: "#3399EE"
    Late male: "#114499"
  source_life_cycle_stage:
    Sporozoite: "#114444"
    Hypnozoite: "#CC88DD"
    Schizont (Liver stage): "#773388"
    Female gametocyte: "#118866"
    Male gametocyte: "#3377CC"
  idc_heuristic_stage_bin:
    Ring/Early trophozoite: "#DDDD55"
    Trophozoite: "#EE8844"
    Schizont (Blood stage): "#BB4400"
    Merozoite: "#771100"
  pred_gametocyte_sex:
    Developing gametocyte: "#AACCDD"
    Female gametocyte: "#118866"
    Male gametocyte: "#3377CC"
  source_sex_annotation:
    Female gametocyte: "#118866"
    Male gametocyte: "#3377CC"

# Human-readable display labels for otherwise machine-ish category values.
value_labels:
  # the accent of Sa2020 as an escape: the file must stay ASCII, since the
  # app may run in a C locale (Shiny Server), where R cannot read UTF-8 bytes
  study_label:
    Sa2020: "S\u00e12020"
  treatment:
    study_control: "Study control"
    No_Treatment: "No treatment"
  # stage names as in the manuscript
  detailed_stage:
    Ring/Early trophozoite: "Ring/early trophozoite"
    Schizont (Blood stage): "Blood schizont"
    Merozoite: "Late schizont/merozoite"
    Schizont (Liver stage): "Liver schizont"
  source_life_cycle_stage:
    Ring/Early trophozoite: "Ring/early trophozoite"
    Schizont (Blood stage): "Blood schizont"
    Merozoite: "Late schizont/merozoite"
    Schizont (Liver stage): "Liver schizont"
  idc_heuristic_stage_bin:
    Ring/Early trophozoite: "Ring/early trophozoite"
    Schizont (Blood stage): "Blood schizont"
    Merozoite: "Late schizont/merozoite"
    Schizont (Liver stage): "Liver schizont"

# Fields whose values are scientific names and should be italicised in the UI.
italicised_fields:
  - host_species
