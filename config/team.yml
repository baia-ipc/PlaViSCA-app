organizations:
  - name: "Institut Pasteur du Cambodge"
    url: "https://www.pasteur-kh.org/"
    logo: "ipc_logo.png"
  - name: "BAIA Unit"
    logo: "baia_logo.png"

# Contacts, each with the questions to address to them (may contain <em>).
contacts:
  - name: "Giorgio Gonnella"
    role: "Head of Bioinformatics and AI Applications"
    affiliation: "Institut Pasteur du Cambodge"
