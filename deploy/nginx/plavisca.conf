# nginx: several PlaViSCA instances behind one address.
#
#   sudo cp deploy/nginx/plavisca.conf /etc/nginx/sites-available/plavisca
#   sudo ln -s /etc/nginx/sites-available/plavisca /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace plavisca.example.org with your host name and list one "server" line
# per running instance. For HTTPS, add the certificate with certbot or your
# own "ssl_certificate" lines.

upstream plavisca {
    # Sticky sessions: a browser keeps talking to the same instance, which
    # a Shiny session needs (its state lives in one R process).
    ip_hash;
    server 127.0.0.1:3838;
    server 127.0.0.1:3839;
    server 127.0.0.1:3840;
    server 127.0.0.1:3841;
}

server {
    listen 80;
    server_name plavisca.example.org;

    # Compress the page, scripts, styles and JSON sent over plain HTTP.
    # Websocket messages (the plots) are not compressed by the proxy.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://plavisca;
        proxy_http_version 1.1;

        # Websocket upgrade: Shiny keeps one open connection per session.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep idle sessions open; a slow plot may take a while to arrive.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
