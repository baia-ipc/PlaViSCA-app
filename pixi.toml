[workspace]
authors = ["Sopheap15 <sopheap15@gmail.com>"]
channels = ["conda-forge", "bioconda", "r", "default"]
name = "plavisca"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
PlaViSca = "R -e 'shiny::runApp(\"app.R\")'"

[dependencies]
r = ">=4.5,<4.6"
r-shiny = ">=1.11.1,<2"
r-shinyjs = ">=2.1.0,<3"
r-dt = ">=0.34.0,<0.35"
r-plotly = ">=4.11.0,<5"
r-rcolorbrewer = ">=1.1_3,<2"
r-tidyverse = ">=2.0.0,<3"
r-later = ">=1.4.4,<2"
r-shinycssloaders = ">=1.1.0,<2"
r-memoise = ">=2.0.1,<3"
