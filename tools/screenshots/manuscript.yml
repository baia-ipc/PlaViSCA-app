# Screenshots of the app for the manuscript figures.
# Run from the app directory, saving next to the manuscript:
#   PLAVISCA_DATA_DIR=/path/to/app_data tools/screenshots/.venv/bin/python \
#     tools/screenshots/take_screenshots.py tools/screenshots/manuscript.yml \
#     --start-app --out-dir /path/to/manuscript/figures

settings:
  width: 1500
  height: 950
  scale: 3           # print resolution: about 600 dpi at 7.5 in wide
  settle: 3

shots:
  # Fig 5: views of the app. (A) side-by-side coloring of the integrated 2D
  # UMAP, by harmonized stage (Plot A) and by three genes of different stages,
  # each in its own colour ("Each gene separately"): CSP (sporozoites, red),
  # DBP (blood schizonts, green), P47 (gametocytes, blue)
  # (Plot B); (B) Gene
  # expression card: Seurat-style dot plot of stage marker genes by life-cycle
  # stage; (C) Metadata plots builder: sunburst of the cells by study and stage.
  # The panels have no output of their own: they are composed into
  # fig5_app_views.png (figures: below).
  - name: fig5_side_by_side
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - click: "#enable_comparison"
      - drawn: true
      - select: {id: color_first_comp, value: stage}
      # Plot B has nothing to draw until genes are selected: no "drawn" here
      - select: {id: color_second, value: genes}
      # wait until the server has filled the gene menu, which resets it
      - wait: 8
      # the gene menu loads its choices from the server while typing: add
      # the genes as choices before selecting them
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      # set again in case the menu was reset after the first time
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      # set again in case the menu was reset after the first time
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      # set again in case the menu was reset after the first time
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
      - select: {id: combine_genes_second, value: each}
      - drawn: true
    element: "#comparison_plots_panel"

  - name: fig5_gene_dotplot
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: dotplot}
      - select: {id: group_exp_0, value: stage}
      # stage markers, from blood stages to liver stages (Pvs25 is P25 and
      # UIS4 an unnamed ETRAMP in the annotation). The gene menu loads its choices from the server
      # while typing: add the genes as choices before selecting them
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          const genes = ['SBP1', 'PM4', 'AMA1', 'RBP2b', 'P25', 'CSP',
                         'ETRAMP (PVP01_0602100)', 'LISP2'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
    element: "#dynamic_col_0 .card"

  - name: fig5_metadata_sunburst
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: sunburst}
      - select: {id: plot_builder_1-field, value: study_label}
      - select: {id: plot_builder_1-split_by, value: detailed_stage}
      - drawn: true
    element: "#plot_builder_1_column .card"

  # S6 Fig: exploration of one gene (AMA1) in the app. (A) Integrated 2D UMAP
  # coloured by its expression, with the gene row (search by name, PlasmoDB
  # and NCBI buttons) above the plot; (B) the same in 3D; (C) Gene expression
  # card, widened to the window: violin plot by life-cycle stage, split by
  # study; (D) the gene row alone, narrowed so that the buttons are legible.
  # Composed into s6_fig_gene_exploration.png (figures: below).
  - name: s6_gene_2d
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - select: {id: color, value: genes}
      - wait: 8
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'AMA1', label: 'AMA1'}); s.setValue(['AMA1']); })()
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'AMA1', label: 'AMA1'}); s.setValue(['AMA1']); })()
      - drawn: true
    element: "#single_plot_panel"

  - name: s6_gene_3d
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - drawn: true
      - select: {id: color, value: genes}
      - wait: 8
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'AMA1', label: 'AMA1'}); s.setValue(['AMA1']); })()
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'AMA1', label: 'AMA1'}); s.setValue(['AMA1']); })()
      - drawn: true
    element: "#single_plot_panel"

  - name: s6_gene_violin
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: violin}
      - select: {id: group_exp_0, value: stage}
      - js: >-
          (() => { const c = document.getElementById("dynamic_col_0"); c.className = "col-sm-12"; window.dispatchEvent(new Event("resize")); })()
      - select: {id: split_exp_0, value: study_label}
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          s.addOption({value: 'AMA1', label: 'AMA1'}); s.setValue(['AMA1']); })()
      - drawn: true
    element: "#dynamic_col_0 .card"

  - name: s6_gene_links
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - select: {id: color, value: genes}
      - wait: 8
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'AMA1', label: 'AMA1'}); s.setValue(['AMA1']); })()
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'AMA1', label: 'AMA1'}); s.setValue(['AMA1']); })()
      - js: >-
          (() => { const p = document.querySelector(".single-gene-panel"); p.style.maxWidth = "700px"; p.querySelector(".embedding-gene-row").style.maxWidth = "700px"; })()
      - wait: 1
      - drawn: true
    element: ".single-gene-panel .embedding-gene-row"

figures:
  - name: fig5_app_views
    rows:
      - [fig5_side_by_side]
      - [fig5_gene_dotplot, fig5_metadata_sunburst]
    output: fig5_app_views.png
    tiff: plos/Fig5.tif   # for the PLOS submission (LZW, 600 dpi)

  - name: s6_fig_gene_exploration
    rows:
      - [s6_gene_2d, s6_gene_3d]
      - [s6_gene_violin]
      - [s6_gene_links]
    output: s6_fig_gene_exploration.png
    tiff: plos/S6_Fig.tif
