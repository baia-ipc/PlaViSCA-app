# Screenshots of the app for the manuscript figures.
# Run from the app directory, saving next to the manuscript:
#   PLAVISCA_DATA_DIR=/path/to/app_data tools/screenshots/.venv/bin/python \
#     tools/screenshots/take_screenshots.py tools/screenshots/manuscript.yml \
#     --start-app --out-dir /path/to/manuscript/figures

settings:
  width: 1500
  height: 950
  scale: 3           # print resolution: about 600 dpi at 7.5 in wide
  settle: 3

shots:
  # Fig 5: views of the app. (A) side-by-side coloring of the integrated 2D
  # UMAP, by harmonized stage (Plot A) and by three genes of different stages,
  # each in its own colour ("Each gene separately"): CSP (sporozoites, red),
  # DBP (blood schizonts, green), P47 (gametocytes, blue)
  # (Plot B); (B) Gene
  # expression card: Seurat-style dot plot of stage marker genes by life-cycle
  # stage; (C) Metadata plots builder: sunburst of the cells by study and stage.
  # The panels have no output of their own: they are composed into
  # fig5_app_views.png (figures: below).
  - name: fig5_side_by_side
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - click: "#enable_comparison"
      - drawn: true
      - select: {id: color_first_comp, value: stage}
      # Plot B has nothing to draw until genes are selected: no "drawn" here
      - select: {id: color_second, value: genes}
      # wait until the server has filled the gene menu, which resets it
      - wait: 8
      # the gene menu loads its choices from the server while typing: add
      # the genes as choices before selecting them
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      # set again in case the menu was reset after the first time
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      # set again in case the menu was reset after the first time
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      # set again in case the menu was reset after the first time
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_second').selectize;
          const genes = ['CSP', 'DBP', 'P47'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
      - select: {id: combine_genes_second, value: each}
      - drawn: true
    element: "#comparison_plots_panel"

  - name: fig5_gene_dotplot
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: dotplot}
      - select: {id: group_exp_0, value: stage}
      # stage markers, from blood stages to liver stages (Pvs25 is P25 and
      # UIS4 an unnamed ETRAMP in the annotation). The gene menu loads its choices from the server
      # while typing: add the genes as choices before selecting them
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          const genes = ['SBP1', 'PM4', 'AMA1', 'RBP2b', 'P25', 'CSP',
                         'ETRAMP (PVP01_0602100)', 'LISP2'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
    element: "#dynamic_col_0 .card"

  - name: fig5_metadata_sunburst
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: sunburst}
      - select: {id: plot_builder_1-field, value: study_label}
      - select: {id: plot_builder_1-split_by, value: detailed_stage}
      - drawn: true
    element: "#plot_builder_1_column .card"

  # S6 Fig: exploration of one gene (ACT1) in the app. (A) Integrated 2D UMAP
  # coloured by its expression, with the gene row (search by name, PlasmoDB
  # and NCBI buttons) above the plot; (B) the same in 3D; (C) Gene expression
  # card, widened to the window: violin plot by life-cycle stage, split by
  # study, with a red box around the PlasmoDB and NCBI buttons.
  # Composed into s6_fig_gene_exploration.png (figures: below).
  - name: s6_gene_2d
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - select: {id: color, value: genes}
      - wait: 8
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'ACT1', label: 'ACT1'}); s.setValue(['ACT1']); })()
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'ACT1', label: 'ACT1'}); s.setValue(['ACT1']); })()
      - drawn: true
    element: "#single_plot_panel"

  - name: s6_gene_3d
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - drawn: true
      - select: {id: color, value: genes}
      - wait: 8
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'ACT1', label: 'ACT1'}); s.setValue(['ACT1']); })()
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          s.addOption({value: 'ACT1', label: 'ACT1'}); s.setValue(['ACT1']); })()
      - drawn: true
      # closer camera than the default (eye at 1.25 on each axis)
      - js: >-
          (() => { Plotly.relayout(document.getElementById('all_plotly'),
          {'scene.camera.eye': {x: 0.85, y: 0.85, z: 0.85}}); })()
      - wait: 4
    element: "#single_plot_panel"

  - name: s6_gene_violin
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: violin}
      - select: {id: group_exp_0, value: stage}
      - js: >-
          (() => { const c = document.getElementById("dynamic_col_0"); c.className = "col-sm-12"; window.dispatchEvent(new Event("resize")); })()
      - select: {id: split_exp_0, value: study_label}
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          s.addOption({value: 'ACT1', label: 'ACT1'}); s.setValue(['ACT1']); })()
      - drawn: true
      # red box around the PlasmoDB and NCBI buttons, referred to in the caption
      - js: >-
          (() => { const b = document.querySelector("#dynamic_col_0 .links-row");
          b.style.outline = "3px solid red"; b.style.outlineOffset = "4px"; })()
      - wait: 1
    element: "#dynamic_col_0 .card"


  # (D) two genes, each in its own colour, with the colour grid of their
  # combinations; (E) six genes around the colour wheel.
  - name: s6_gene_grid
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - select: {id: color, value: genes}
      - wait: 8
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          const genes = ['DBP', 'AMA1'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          const genes = ['DBP', 'AMA1'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
      - select: {id: combine_genes, value: each}
      - drawn: true
    element: "#single_plot_panel"

  - name: s6_gene_wheel
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - select: {id: color, value: genes}
      - wait: 8
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          const genes = ['CSP', 'LISP2', 'SBP1', 'PM4', 'AMA1', 'P25'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - wait: 5
      - js: >-
          (() => { const s = document.getElementById('genes_n').selectize;
          const genes = ['CSP', 'LISP2', 'SBP1', 'PM4', 'AMA1', 'P25'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
      - select: {id: combine_genes, value: each}
      - drawn: true
    element: "#single_plot_panel"

  # (F) the window opened by a double-click (or right-click) on a cell of an
  # embedding: the genes the cell expresses, sorted by expression. The
  # double-click is simulated by calling the page's openCellDetails() with the
  # key (row number) of the first plotted cell.
  - name: s6_cell_details
    tab: Embeddings
    steps:
      - click: ".tab-pane.active .plot-settings-layout .collapse-toggle"
      - click: "input[name='plot'][value='2d']"
      - drawn: true
      - js: "openCellDetails(1)"
      - wait_for: ".modal-dialog table"
      - wait: 4
    element: ".modal-content"

  # S7 Fig: the plot types of the Gene expression tab not shown elsewhere,
  # on four stage markers (AMA1, blood schizonts; P25, gametocytes; CSP,
  # sporozoites; LISP2, liver stages): (A) box plot of ACT1 by life-cycle
  # stage, split by study; (B) Cleveland dot plot of the % of cells detecting
  # each gene, by stage, one point per study; (C) heatmap of the % detecting,
  # scaled per gene; (D) violin plots, one row per gene, by broad stage.
  # Only the plot is captured; the settings are in the caption.
  - name: s7_box
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: box}
      - select: {id: group_exp_0, value: stage}
      - select: {id: split_exp_0, value: study_label}
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          const genes = ['ACT1'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
    element: "#gene_exp_plotly_0"

  - name: s7_cleveland
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: cleveland}
      - select: {id: group_exp_0, value: stage}
      - select: {id: points_exp_0, value: study_label}
      - select: {id: value_exp_0, value: percent}
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          const genes = ['AMA1', 'P25', 'CSP', 'LISP2'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
    element: "#gene_exp_plotly_0"

  - name: s7_heatmap
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: heatmap}
      - select: {id: group_exp_0, value: stage}
      - select: {id: value_exp_0, value: percent}
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          const genes = ['AMA1', 'P25', 'CSP', 'LISP2'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - drawn: true
    element: "#gene_exp_plotly_0"

  - name: s7_violin_each
    tab: Gene expression
    steps:
      - drawn: true
      - select: {id: plot_type_exp_0, value: violin}
      - select: {id: group_exp_0, value: broad_stage}
      - select: {id: split_exp_0, value: none}
      - js: >-
          (() => { const s = document.getElementById('genes_exp_0').selectize;
          const genes = ['AMA1', 'P25', 'CSP', 'LISP2'];
          genes.forEach(g => s.addOption({value: g, label: g}));
          s.setValue(genes); })()
      - wait: 3
      - select: {id: combine_exp_0, value: each}
      - js: >-
          (() => { const p = document.getElementById('gene_exp_plotly_0'); p.style.height = '700px';
          window.dispatchEvent(new Event('resize')); })()
      - drawn: true
    element: "#gene_exp_plotly_0"

  # S8 Fig: the plot types of the Metadata plots tab not shown elsewhere,
  # cells by study (A, B) and by study and life-cycle stage (C-F): bar chart,
  # pie chart, stacked bars as percentages, grouped bars, heatmap, one pie
  # per study. Only the plot is captured.
  - name: s8_bar
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: bar}
      - select: {id: plot_builder_1-field, value: study_label}
      - drawn: true
    element: "#plot_builder_1-plot"

  - name: s8_pie
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: pie}
      - select: {id: plot_builder_1-field, value: study_label}
      - drawn: true
    element: "#plot_builder_1-plot"

  - name: s8_stacked
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: stacked}
      - select: {id: plot_builder_1-field, value: study_label}
      - select: {id: plot_builder_1-split_by, value: detailed_stage}
      - click: "input[name='plot_builder_1-show_as'][value='percent']"
      - drawn: true
    element: "#plot_builder_1-plot"

  - name: s8_grouped
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: grouped}
      - select: {id: plot_builder_1-field, value: study_label}
      - select: {id: plot_builder_1-split_by, value: detailed_stage}
      - drawn: true
    element: "#plot_builder_1-plot"

  - name: s8_heatmap
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: heatmap}
      - select: {id: plot_builder_1-field, value: study_label}
      - select: {id: plot_builder_1-split_by, value: detailed_stage}
      - drawn: true
    element: "#plot_builder_1-plot"

  - name: s8_pies
    tab: Metadata plots
    steps:
      - drawn: true
      - select: {id: plot_builder_1-type, value: pies}
      - select: {id: plot_builder_1-field, value: study_label}
      - select: {id: plot_builder_1-split_by, value: detailed_stage}
      - drawn: true
    element: "#plot_builder_1-plot"

figures:
  - name: fig5_app_views
    rows:
      - [fig5_side_by_side]
      - [fig5_gene_dotplot, fig5_metadata_sunburst]
    output: fig5_app_views.png
    tiff: plos/Fig5.tif   # for the PLOS submission (LZW, 600 dpi)

  - name: s6_fig_gene_exploration
    rows:
      - [s6_gene_2d, s6_gene_3d]
      - [s6_gene_violin]
      - [s6_gene_grid, s6_gene_wheel]
      - [s6_cell_details]
    output: s6_fig_gene_exploration.png
    tiff: plos/S6_Fig.tif

  - name: s7_fig_gene_plot_types
    rows:
      - [s7_box, s7_cleveland]
      - [s7_heatmap, s7_violin_each]
    output: s7_fig_gene_plot_types.png
    tiff: plos/S7_Fig.tif

  - name: s8_fig_metadata_plot_types
    rows:
      - [s8_bar, s8_pie, s8_stacked]
      - [s8_grouped, s8_heatmap, s8_pies]
    output: s8_fig_metadata_plot_types.png
    tiff: plos/S8_Fig.tif
